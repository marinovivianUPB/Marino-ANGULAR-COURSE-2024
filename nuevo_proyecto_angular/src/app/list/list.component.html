<div class="flex flex-col items-center space-y-4">
    <h1 class="text-4xl font-bold text-gray-800">Cities</h1>
    <search (sendData)="receiveSearchTerm($event)"></search>
    @if(cities && cities.length > 0){
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-5xl">
        @for(city of cities; track city){
          <citycard [city]="city" (deleteCity)="deleteCity($event)"></citycard>
        }
      </div>
    } @else{
      <div class="flex justify-center items-center h-64">
        <p class="text-gray-500 text-lg font-semibold">No cities available</p>
      </div>
    }
    <cityform [cities]="cities" (addCityEvent)="addCity($event)"></cityform>
</div>
