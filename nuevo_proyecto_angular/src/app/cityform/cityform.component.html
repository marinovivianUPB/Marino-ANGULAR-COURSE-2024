<div class="w-full max-w-md mt-8">
    <form [formGroup]="cityForm">
      <label class="block text-gray-700 font-semibold mb-2">City Name:</label>
      <input 
        type="text" 
        [formControlName]="'name'" 
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      
      <div *ngIf="cityForm.get('name')?.invalid && cityForm.get('name')?.touched" class="text-red-500 text-sm mt-1">
        Name is required
      </div>

      <div *ngIf="invalidName" class="text-red-500 text-sm mt-1">
        Name is not valid
      </div>
      
      <button 
        (click)="addCity()"  
        [disabled]="cityForm.invalid" 
        class="w-full bg-blue-500 text-white font-semibold py-2 rounded-md hover:bg-blue-600 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        ADD CITY
      </button>
    </form>
</div>
