<div class="container mx-auto flex justify-center items-center mt-8">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      placeholder="Search..." 
      class="w-full max-w-xs p-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <button 
      (click)="sendSearchTerm()" 
      class="bg-blue-500 text-white px-4 py-2 rounded-r-md hover:bg-blue-600 transition duration-200"
    >
      Search
    </button>
  </div>
