<div class="flex flex-col items-center space-y-4">
    <h1 class="text-4xl font-bold text-gray-800">Cities</h1>
    <search (sendData)="receiveSearchTerm($event)"></search>
    <list [cities]="cities" (sendDelete)="deleteCity($event)"></list>
    <cityform [cities]="cities" (addCityEvent)="addCity($event)"></cityform>
</div>
